{% include "header.html" %}

<form id="auth-form" method="POST" action="{{ args.public_path_as_str() }}/{{path}}/{{id}}{{query}}" enctype="multipart/form-data">
  {% if status == "success" %}
  <b>{{ "Success!"|t }}</b> <br>
  {% endif %}

  {% if permission == "write" %}
  <label for="password" style="margin-bottom: 0.5rem;">{{ "Please enter the write password to modify or remove this upload."|t }}<sup>
      <a href="{{ args.public_path_as_str() }}/guide#write">?</a></sup></label>
  {% else %}
  <label for="password" style="margin-bottom: 0.5rem;">{{ "Please enter the read password to access this upload."|t }}<sup>
      <a href="{{ args.public_path_as_str() }}/guide#read">?</a></sup></label>
  {% endif %}

  <input id="password-field" placeholder="{{ "Password"|t }}" name="password" type="password" autocomplete="off" />
  <button>{{ "Okay"|t }}</button>

  {% if status == "incorrect" %}
  <b>{{ "Incorrect password."|t }}</b>
  {% endif %}
</form>

{% include "footer.html" %} {% if !args.pure_html %}
<style>
  #auth-form {
    background-color: var(--background-alt);
    border-radius: 6px;
    padding: 10px;
    width: fit-content;
    margin: auto;
    margin-top: 2rem;
    margin-bottom: 2rem;
  }
</style>
{% endif %}

{% include "header.html" %}

<form id="auth-form" method="POST" action="{{ args.public_path_as_str() }}/admin/" enctype="multipart/form-data">
  <label for="username">{{ "Administrator username"|t }}</label>
  <input id="username-field" placeholder="{{ "Username"|t }}" type="username" autocomplete="off" name="username">
  <label for="password">{{ "Administrator password."|t }}</label>
  <input id="password-field" placeholder="{{ "Password"|t }}" type="password" autocomplete="off" name="password">
  <button>{{ "Sign in"|t }}</button>
  {% if status == "incorrect" %}
  <p>{{ "Incorrect username or password."|t }}</p>
  {% endif %}
</form>

{% include "footer.html" %} {% if !args.pure_html %}
<style>
  #auth-form {
    background-color: var(--background-alt);
    border-radius: 6px;
    padding: 10px;
    width: fit-content;
    margin: auto;
    margin-top: 2rem;
    margin-bottom: 2rem;
  }
</style>
{% endif %}

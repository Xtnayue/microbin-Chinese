name: Build and push image to GHCR

# 什么时候跑：
#   - 推 master：产出 latest + master + sha 三个标签
#   - 推 v1.2.3 这类 tag：额外产出 1.2.3 / 1.2 两个版本标签
#   - PR：只构建不推送，用来验证 Dockerfile 还能编过
#   - 手动触发：给一次「现在就出一版」的机会
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    # Dockerfile 里是 `COPY . .`，改一行 README 也会打穿缓存、把整个
    # cargo build 重跑一遍（约 7 分钟），而产物二进制根本没变。
    # 纯文档改动直接跳过。（tag 推送不受 paths 过滤影响，GitHub 的规则。）
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支连推多次时，取消上一次还在跑的构建，省 runner 时间
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # 默认只编 x86_64。arm64 需要 QEMU 模拟，而这个项目要编 vendored OpenSSL
  # （openssl 的 `vendored` feature）+ SQLite + oniguruma，再加 release 的 LTO，
  # 模拟下很容易跑满一两个小时。要出 arm64 就改成：
  #   PLATFORMS: linux/amd64,linux/arm64
  # 并把下面的 timeout-minutes 提到 300 以上。
  PLATFORMS: linux/amd64

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read   # checkout
      packages: write  # 推 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 双架构时这一步不能省：arm64 的构建靠 QEMU 模拟。
      # 只编 amd64 时它不起作用，但留着无害，切换架构时不用再改。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 的镜像名必须全小写，而 github.repository 会保留仓库原有大小写
      # （这里是 Xtnayue/microbin-Chinese）。所以用 bash 的小写展开自己拼，
      # 不依赖 metadata-action 的内部规范化。
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR 来自 fork 时 GITHUB_TOKEN 是只读的，推不上去；
      # 而且 PR 只需要验证能编过，所以干脆不登录、不推送。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 里 `cargo build --release` 是整层重编，没有缓存时
          # 一次要十几分钟。用 GitHub Actions 的缓存后端存这一层，
          # 之后只有 Cargo.toml / 源码变动才会重编。
          cache-from: type=gha
          cache-to: type=gha,mode=max
